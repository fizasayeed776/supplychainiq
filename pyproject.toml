[tool.ruff]
# First-pass lenient config: catch syntax errors and real bugs,
# but ignore line-length and unused-import noise until the codebase
# is cleaned up incrementally.
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, etc.)
    "W",   # pycodestyle warnings
    "G",   # flake8-logging-format
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "BLE", # flake8-blind-except
]
ignore = [
    "E501",  # line too long — enforced separately once baseline is clean
    "F401",  # imported but unused — many Django apps import for side-effects
    "F811",  # redefinition of unused name — common in test setUp overrides
    "E402",  # module level import not at top of file
    "W291",  # trailing whitespace
    "W293",  # whitespace before ':'
    "EXE002",  # Django source files are never meant to be executed directly;
               # the executable bit was set accidentally, not deliberately.
    "RUF012",  # Standard Django/DRF Meta.fields, permission_classes,
               # filterset_fields, and CHOICES class attributes are the
               # idiomatic pattern for this framework; ClassVar annotations
               # would be non-standard here.
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests*",
    "manage.py",
    "config/*",
    "scripts/*",
]

[tool.coverage.report]
# Fail the build if coverage drops below 60%.
# Raise this threshold incrementally as coverage improves.
fail_under = 60
show_missing = true
skip_covered = false
