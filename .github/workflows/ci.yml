name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install -r backend/requirements-dev.txt

      - name: Run ruff
        run: ruff check backend/

  # ── 2. Backend tests ───────────────────────────────────────────────────────
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: supplychainiq
          POSTGRES_USER: supplychainiq
          POSTGRES_PASSWORD: supplychainiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supplychainiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Django
      DJANGO_SECRET_KEY: ci-dummy-secret-key-not-used-in-production-xxxxxxxx
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost"
      # Postgres — point at localhost (GHA services bind to localhost)
      POSTGRES_DB: supplychainiq
      POSTGRES_USER: supplychainiq
      POSTGRES_PASSWORD: supplychainiq
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Redis — same: localhost in GHA
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_BROKER_DB: "0"
      REDIS_CACHE_DB: "1"
      REDIS_CHANNELS_DB: "2"
      # LLM / embedding — dummy values; tests should not reach the network.
      # NOTE: test_judge_suppresses_rounding_and_unit_conversion currently makes
      # a real call to Groq. Until that test is mocked, the CI_DUMMY key will
      # cause a 401 and that test will fail. See repo issue tracker.
      LLM_PROVIDER: groq
      LLM_API_KEY: ci-dummy-llm-key
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL_FAST: llama-3.1-8b-instant
      LLM_MODEL_JUDGE: llama-3.3-70b-versatile
      LLM_MONTHLY_USAGE_CAP_USD: "20"
      EMBEDDING_PROVIDER: gemini
      EMBEDDING_API_KEY: ci-dummy-embedding-key
      EMBEDDING_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
      EMBEDDING_MODEL: gemini-embedding-001
      EMBEDDING_DIM: "1536"
      # Misc
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      DEFAULT_FROM_EMAIL: noreply@supplychainiq.local
      PARTNER_WEBHOOK_SECRET: ci-webhook-secret
      TESSERACT_CMD: /usr/bin/tesseract
      OCR_LOW_CONFIDENCE_THRESHOLD: "0.65"
      FX_RATES_BASE_URL: https://api.frankfurter.app
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            poppler-utils \
            libpq-dev \
            gcc

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run tests with coverage
        working-directory: backend
        run: |
          coverage run manage.py test --verbosity=2
          coverage report

  # ── 3. Frontend build ──────────────────────────────────────────────────────
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build
